<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Receita</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <button id="botaoTema" class="btn btn-dark botao-tema">
        Tema escuro
    </button>

    <main class="container py-5">
        <a href="index.html" class="btn btn-secondary mb-4">
            voltar
        </a>

        <h1>Cadastrar receita</h1>

        <form id="formCadastro">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" id="nome" class="form-control mb-3" required>

            <label for="descricao" class="form-label">Descriçao</label>
            <input type="text" id="descricao" class="form-control mb-3" required>

            <label for="imagem" class="form-label">Imagem da receita</label>
            <input type="file"
                   id="imagem"
                   class="form-control mb-3"
                   accept="image/jpeg, image/png, image/webp"
                   required>

            <label for="categoria" class="form-label">Categoria</label>
            <input type="text" id="categoria" class="form-control mb-3" required>

            <label for="tempo" class="form-label">Tempo de preparo</label>
            <input type="text"
                   id="tempo"
                   class="form-control mb-3"
                   required>

            <label for="dificuldade" class="form-label">Dificuldade</label>
            <select id="dificuldade" class="form-select mb-3" required>
                <option value="Fácil">Fácil</option>
                <option value="Médio">Médio</option>
                <option value="Difícil">Difícil</option>
            </select>

            <label for="ingredientesCadastro" class="form-label">
                ingredientes
            </label>
            <textarea id="ingredientesCadastro"
                      class="form-control mb-3"
                      rows="5"
                      required></textarea>

            <label for="preparoCadastro" class="form-label">
                Modo de preparo
            </label>
            <textarea id="preparoCadastro"
                      class="form-control mb-3"
                      rows="5"
                      required></textarea>

            <button type="submit" class="btn btn-primary">
                salvar receita
            </button>
        </form>
    </main>

    <script src="tema.js"></script>
    <script src="cadastro.js"></script>
</body>
</html>
